<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>パスワード再設定 - ベイバト！！</title>
<style>
  body { font-family: -apple-system, "Hiragino Kaku Gothic ProN", sans-serif; line-height: 1.8; max-width: 720px; margin: 0 auto; padding: 24px 16px; color: #222; }
  h1 { font-size: 1.4em; border-bottom: 2px solid #21706e; padding-bottom: 8px; }
  p, li { font-size: 0.95em; }
  input { width: 100%; box-sizing: border-box; padding: 10px; font-size: 1em; margin: 6px 0 14px; border: 1px solid #bbb; border-radius: 8px; }
  button { background: #21706e; color: #fff; border: none; padding: 12px 20px; font-size: 1em; border-radius: 8px; width: 100%; }
  button:disabled { opacity: 0.5; }
  #message { margin-top: 16px; font-size: 0.95em; }
  .error { color: #b00020; }
  .ok { color: #21706e; }
</style>
</head>
<body>
<h1>パスワード再設定</h1>
<p>「ベイバト！！」の新しいパスワードを設定します。</p>

<div id="form-area" style="display:none">
  <label for="password">新しいパスワード（6文字以上）</label>
  <input type="password" id="password" autocomplete="new-password">
  <label for="password2">新しいパスワード（確認）</label>
  <input type="password" id="password2" autocomplete="new-password">
  <button id="submit">パスワードを設定する</button>
</div>

<p id="message">リンクを確認しています…</p>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // ===== 設定（Supabase プロジェクト作成後に、URLとanon keyをここへ入力する） =====
  const SUPABASE_URL = "YOUR_SUPABASE_URL";
  const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";
  // ==========================================================================

  const messageEl = document.getElementById("message");
  const formArea = document.getElementById("form-area");
  const submitBtn = document.getElementById("submit");

  function showMessage(text, cls) {
    messageEl.textContent = text;
    messageEl.className = cls || "";
  }

  let client = null;
  try {
    client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  } catch (e) {
    showMessage("現在このページは準備中です。しばらくしてからお試しください。", "error");
  }

  if (client) {
    // 再設定メールのリンクには #access_token=...&type=recovery が付いて届く。
    // supabase-js が自動でセッションを復元するので、その成否で表示を切り替える。
    setTimeout(async () => {
      const { data } = await client.auth.getSession();
      if (data && data.session) {
        formArea.style.display = "block";
        showMessage("新しいパスワードを入力してください。", "");
      } else {
        showMessage("リンクが無効か、有効期限が切れています。アプリの「アカウント・設定」から、もう一度パスワード再設定メールを送信してください。", "error");
      }
    }, 600);

    submitBtn.addEventListener("click", async () => {
      const p1 = document.getElementById("password").value;
      const p2 = document.getElementById("password2").value;
      if (p1.length < 6) {
        showMessage("パスワードは6文字以上で入力してください。", "error");
        return;
      }
      if (p1 !== p2) {
        showMessage("確認用のパスワードが一致しません。", "error");
        return;
      }
      submitBtn.disabled = true;
      const { error } = await client.auth.updateUser({ password: p1 });
      if (error) {
        submitBtn.disabled = false;
        showMessage("設定に失敗しました。リンクの有効期限が切れている可能性があります。お手数ですが、もう一度メールを送信してください。", "error");
      } else {
        formArea.style.display = "none";
        showMessage("パスワードを設定しました。アプリに戻って、新しいパスワードでログインしてください。", "ok");
      }
    });
  }
</script>
</body>
</html>
